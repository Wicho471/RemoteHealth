  # ---------------------------
  # Build Android (mobile module) 
  # ---------------------------
  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    name: Build Mobile App (Android)
    env:
      MAVEN_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1G
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: '17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt install libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Verify java & native-image
        run: |
          java --version
          echo "GRAALVM_HOME=$GRAALVM_HOME"
          native-image --version || true

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install/Setup Android NDK (r25c) and CMake
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build all project modules
        run: mvn -B clean install -DskipTests

      - name: Apply Gluon License
        uses: gluonhq/gluon-build-license@v2
        with:
          gluon-license: ${{ secrets.GLUON_LICENSE }}
          dir: mobile

      - name: Get mobile version
        id: get_version_mobile
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f mobile/pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build native image - compile (Android) (con debug)
        working-directory: mobile
        run: |
          set -e
          mvn -Pandroid gluonfx:compile gluonfx:link gluonfx:package || (
            echo "Compilación Android fallida. Preparando logs..."
            mkdir -p ../compile-logs/android
            find target/gluonfx/aarch64-android/gvm/log -type f -name "*.log" -exec cp {} ../compile-logs/android/ \; || true
            find target/gluonfx/log -type f -name "*.log" -exec cp {} ../compile-logs/android/ \; || true
            cd ../compile-logs && zip -r android-compile-logs.zip android
            echo "upload_path=$(pwd)/android-compile-logs.zip" >> $GITHUB_OUTPUT
            exit 1
          )
        continue-on-error: false

      - name: Upload Android compile logs to Release
        if: failure()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: compile-logs/android-compile-logs.zip
          asset_name: RemoteHealth-${{ steps.get_version_mobile.outputs.version }}-android-compile-logs.zip
          asset_content_type: application/zip

      - name: list mobile/target/gluonfx
        run: ls -la mobile/target/gluonfx || true

      - name: Build native image - link
        working-directory: mobile
        run: mvn -B -Pandroid -DskipTests gluonfx:link

      - name: Package APK (gluonfx:package)
        working-directory: mobile
        run: mvn -B -Pandroid -DskipTests gluonfx:package

      - name: Detect APK
        id: detect_apk
        run: |
          apk=$(find mobile/target -type f -name "*.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found in mobile/target after packaging"
            exit 1
          fi
          echo "apk_path=$apk" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload APK to Release (customized)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.detect_apk.outputs.apk_path }}
          asset_name: RemoteHealth-${{ steps.get_version_mobile.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive

  # ---------------------------
  # Build iOS (mobile module) - corregido
  # ---------------------------
  build-ios:
    needs: create-release
    runs-on: macos-latest
    name: Build Mobile App (iOS)
    env:
      MAVEN_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1G
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: '17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify java & native-image
        run: |
          java --version
          echo "GRAALVM_HOME=$GRAALVM_HOME"
          native-image --version || true

      - name: Build all project modules
        run: mvn -B clean install -DskipTests
        
      - name: Apply Gluon License
        uses: gluonhq/gluon-build-license@v2
        with:
          gluon-license: ${{ secrets.GLUON_LICENSE }}
          dir: mobile

      - name: Get mobile version (iOS)
        id: get_version_mobile_ios
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f mobile/pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build native image - compile (iOS) (con debug)
        working-directory: mobile
        run: |
          set -e
          mvn -Pios gluonfx:compile gluonfx:link gluonfx:package || (
            echo "Compilación iOS fallida. Preparando logs..."
            mkdir -p ../compile-logs/ios
            find target/gluonfx/aarch64-ios/gvm/log -type f -name "*.log" -exec cp {} ../compile-logs/ios/ \; || true
            find target/gluonfx/log -type f -name "*.log" -exec cp {} ../compile-logs/ios/ \; || true
            cd ../compile-logs && zip -r ios-compile-logs.zip ios
            echo "upload_path=$(pwd)/ios-compile-logs.zip" >> $GITHUB_OUTPUT
            exit 1
          )
        continue-on-error: false

      - name: Upload iOS compile logs to Release
        if: failure()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: compile-logs/ios-compile-logs.zip
          asset_name: RemoteHealth-${{ steps.get_version_mobile_ios.outputs.version }}-ios-compile-logs.zip
          asset_content_type: application/zip

      - name: list mobile/target/gluonfx
        run: ls -la mobile/target/gluonfx || true

      - name: Build native image - link (iOS)
        working-directory: mobile
        run: mvn -B -Pios -DskipTests gluonfx:link

      - name: Package IPA (gluonfx:package)
        working-directory: mobile
        run: mvn -B -Pios -DskipTests gluonfx:package

      - name: Detect IPA
        id: detect_ipa
        run: |
          ipa=$(find mobile/target -type f -name "*.ipa" | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error::No IPA found in mobile/target after packaging"
            exit 1
          fi
          echo "ipa_path=$ipa" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload IPA to Release (customized)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.detect_ipa.outputs.ipa_path }}
          asset_name: RemoteHealth-${{ steps.get_version_mobile_ios.outputs.version }}.ipa
          asset_content_type: application/octet-stream
