name: Build & Release RemoteHealth

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  JAVAFX_VERSION: 21.0.6

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v3
      - name: Crear Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          tag_name:      ${{ github.ref_name }}
          release_name:  RemoteHealth ${{ github.ref_name }}
          body:          Release generado automáticamente para ${{ github.ref_name }}
          draft:         false
          prerelease:    false

  get-fatjar:
    runs-on: ubuntu-latest
    outputs:
      jar_name: ${{ steps.jar.outputs.jar_name }}
      jar_path: ${{ steps.jar.outputs.jar_path }}
      project_version: ${{ steps.version.outputs.project_version }}
    steps:
      - uses: actions/checkout@v3
      - name: Obtener versión del proyecto
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "project_version=$VERSION" >> $GITHUB_OUTPUT
      - name: Construir Fat JAR
        run: mvn -B clean package -pl desktop -am
      - name: Detectar Fat JAR
        id: jar
        run: |
          JAR_PATH=$(ls desktop/target/*-jar-with-dependencies.jar | head -n 1)
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

  build-windows:
    needs: [create-release, get-fatjar]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B clean package -pl desktop -am
      - run: |
          Invoke-WebRequest https://download2.gluonhq.com/openjfx/${{ env.JAVAFX_VERSION }}/openjfx-${{ env.JAVAFX_VERSION }}_windows-x64_bin-jmods.zip -OutFile javafx-jmods.zip
          Expand-Archive javafx-jmods.zip -DestinationPath javafx-jmods
      - run: |
          jlink --module-path "$env:JAVA_HOME/jmods;javafx-jmods/javafx-jmods-${{ env.JAVAFX_VERSION }}" `
                --add-modules ALL-MODULE-PATH `
                --output desktop/target/RemoteHealth-runtime
      - run: |
          New-Item -ItemType Directory -Force -Path desktop/target/installers | Out-Null
          Copy-Item -Path "desktop/src/main/resources/org/axolotlj/remotehealth/desktop/img/favicon.ico" -Destination "desktop/target/app-icon.ico"
          jpackage `
            --input desktop/target `
            --dest desktop/target/installers `
            --name RemoteHealth `
            --main-jar "${{ needs.get-fatjar.outputs.jar_name }}" `
            --main-class org.axolotlj.remotehealth.desktop.DesktopApp `
            --type msi `
            --runtime-image desktop/target/RemoteHealth-runtime `
            --win-shortcut `
            --win-menu `
            --win-menu-group "Remote Health" `
            --icon desktop/target/app-icon.ico
      - name: Detectar MSI
        id: detect_msi
        run: |
          $file = Get-ChildItem "desktop/target/installers/*.msi" | Select-Object -First 1
          echo "msi_path=$($file.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url:  ${{ needs.create-release.outputs.upload_url }}
          asset_path:  ${{ steps.detect_msi.outputs.msi_path }}
          asset_name:  RemoteHealth-${{ needs.get-fatjar.outputs.project_version }}.msi
          asset_content_type: application/octet-stream
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url:  ${{ needs.create-release.outputs.upload_url }}
          asset_path:  ${{ needs.get-fatjar.outputs.jar_path }}
          asset_name:  RemoteHealth-${{ needs.get-fatjar.outputs.project_version }}-jar-with-dependencies.jar
          asset_content_type: application/java-archive

  build-macos:
    needs: [create-release, get-fatjar]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B clean package -pl desktop -am
      - run: |
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/${{ env.JAVAFX_VERSION }}/openjfx-${{ env.JAVAFX_VERSION }}_osx-x64_bin-jmods.zip
          unzip javafx-jmods.zip -d javafx-jmods
      - run: |
          jlink --module-path "$JAVA_HOME/jmods:javafx-jmods/javafx-jmods-${{ env.JAVAFX_VERSION }}" \
                --add-modules ALL-MODULE-PATH \
                --output desktop/target/RemoteHealth-runtime
      - run: |
          mkdir -p desktop/target/installers
          cp desktop/src/main/resources/org/axolotlj/remotehealth/desktop/img/favicon.icns desktop/target/app-icon.icns
          jpackage \
            --input desktop/target \
            --dest desktop/target/installers \
            --name RemoteHealth \
            --main-jar "${{ needs.get-fatjar.outputs.jar_name }}" \
            --main-class org.axolotlj.remotehealth.desktop.DesktopApp \
            --type dmg \
            --runtime-image desktop/target/RemoteHealth-runtime \
            --icon desktop/target/app-icon.icns
      - name: Detectar DMG
        id: detect_dmg
        run: |
          echo "dmg_path=$(ls desktop/target/installers/*.dmg | head -n 1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url:  ${{ needs.create-release.outputs.upload_url }}
          asset_path:  ${{ steps.detect_dmg.outputs.dmg_path }}
          asset_name:  RemoteHealth-${{ needs.get-fatjar.outputs.project_version }}.dmg
          asset_content_type: application/octet-stream

  build-linux:
    needs: [create-release, get-fatjar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B clean package -pl desktop -am
      - run: sudo apt-get update -y && sudo apt-get install -y fakeroot dpkg rpm
      - run: |
          wget https://download2.gluonhq.com/openjfx/${{ env.JAVAFX_VERSION }}/openjfx-${{ env.JAVAFX_VERSION }}_linux-x64_bin-jmods.zip -O javafx-jmods.zip
          unzip javafx-jmods.zip -d javafx-jmods
      - run: |
          jlink --module-path "$JAVA_HOME/jmods:javafx-jmods/javafx-jmods-${{ env.JAVAFX_VERSION }}" \
                --add-modules ALL-MODULE-PATH \
                --output desktop/target/RemoteHealth-runtime
      - run: |
          mkdir -p desktop/target/installers
          cp desktop/src/main/resources/org/axolotlj/remotehealth/desktop/img/favicon.png desktop/target/app-icon.png
          jpackage \
            --input desktop/target \
            --dest desktop/target/installers \
            --name RemoteHealth \
            --main-jar "${{ needs.get-fatjar.outputs.jar_name }}" \
            --main-class org.axolotlj.remotehealth.desktop.DesktopApp \
            --type deb \
            --runtime-image desktop/target/RemoteHealth-runtime \
            --icon desktop/target/app-icon.png \
            --linux-shortcut

      - name: Detectar DEB
        id: detect_deb
        run: |
          echo "deb_path=$(ls desktop/target/installers/*.deb | head -n 1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url:  ${{ needs.create-release.outputs.upload_url }}
          asset_path:  ${{ steps.detect_deb.outputs.deb_path }}
          asset_name:  RemoteHealth-${{ needs.get-fatjar.outputs.project_version }}.deb
          asset_content_type: application/octet-stream

  # ---------------------------
  # Build Android (mobile module)
  # ---------------------------
  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    name: Build Mobile App (Android)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Setup GraalVM (exports GRAALVM_HOME)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Export ANDROID_NDK_HOME for subsequent steps
        run: echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Apply Gluon License
        uses: gluonhq/gluon-build-license@v2
        with:
          gluon-license: ${{ secrets.GLUON_LICENSE }}
          dir: mobile

      - name: Get version from Maven (mobile)
        id: get_version_mobile
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f mobile/pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build native image (gluonfx:build) - creates native libs
        working-directory: mobile
        run: mvn -B -Pandroid -DskipTests gluonfx:build

      - name: list gluonfx output (mobile/target)
        run: ls -la mobile/target/gluonfx || true

      - name: Find native .so produced by the build
        id: find_so
        run: |
          so=$(find mobile/target -type f -name "lib*.so" | head -n 1 || true)
          echo "so_path=$so" >> $GITHUB_OUTPUT

      - name: Fail early if native library missing (helpful message)
        if: ${{ steps.find_so.outputs.so_path == '' }}
        run: |
          echo "::error::Native library not found under mobile/target. Possible causes: graalvm not installed or configured, Android NDK missing, or 'gluonfx:build' failed."
          echo "Comprueba GRAALVM_HOME, ANDROID_SDK/NDK and re-run the build locally to inspect logs."
          exit 1

      - name: Package APK (gluonfx:package)
        working-directory: mobile
        run: mvn -B -Pandroid -DskipTests gluonfx:package

      - name: Detect APK
        id: detect_apk
        run: |
          apk=$(find mobile/target -type f -name "*.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found in mobile/target after packaging"
            exit 1
          fi
          echo "apk_path=$apk" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.detect_apk.outputs.apk_path }}
          asset_name: RemoteHealth-${{ steps.get_version_mobile.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive

  # ---------------------------
  # Build iOS (mobile module)
  # ---------------------------
  build-ios:
    needs: create-release
    runs-on: macos-latest
    name: Build Mobile App (iOS)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Setup GraalVM (exports GRAALVM_HOME)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'

      - name: Apply Gluon License
        uses: gluonhq/gluon-build-license@v2
        with:
          gluon-license: ${{ secrets.GLUON_LICENSE }}
          dir: mobile

      - name: Get version from Maven (mobile)
        id: get_version_mobile_ios
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f mobile/pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build native image (gluonfx:build) for iOS
        working-directory: mobile
        run: mvn -B -Pios -DskipTests gluonfx:build

      - name: list gluonfx output (mobile/target)
        run: ls -la mobile/target/gluonfx || true

      - name: Package IPA (gluonfx:package)
        working-directory: mobile
        run: mvn -B -Pios -DskipTests gluonfx:package

      - name: Detect IPA
        id: detect_ipa
        run: |
          ipa=$(find mobile/target -type f -name "*.ipa" | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error::No IPA found in mobile/target after packaging"
            exit 1
          fi
          echo "ipa_path=$ipa" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.detect_ipa.outputs.ipa_path }}
          asset_name: RemoteHealth-${{ steps.get_version_mobile_ios.outputs.version }}.ipa
          asset_content_type: application/octet-stream
