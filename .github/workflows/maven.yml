name: Build & Release RemoteHealth

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: RemoteHealth ${{ github.ref_name }}
          body: Release generated automatically for ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    needs: create-release
    name: Build Desktop JAR (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            asset_suffix: windows.jar
          - os: ubuntu-latest
            asset_suffix: linux.jar
          - os: macos-latest
            asset_suffix: macos.jar
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get App Version from Tag
        id: get_version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Build All Modules & Desktop Fat JAR
        run: mvn -B clean install -DskipTests

      - name: Locate Desktop Fat JAR
        id: find_jar
        run: |
          jar_path=$(find desktop/target -type f -name "*.jar" | grep -v original | head -n 1)
          if [ -z "$jar_path" ]; then
            echo "ERROR: No JAR found"
            exit 1
          fi
          echo "JAR found at $jar_path"
          echo "jar_path=$jar_path" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload Desktop JAR to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_jar.outputs.jar_path }}
          name: remotehealth-desktop-${{ env.APP_VERSION }}-${{ matrix.asset_suffix }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile:
    needs: create-release
    name: Build Mobile App (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            maven_profile: android
            asset_suffix: apk
            asset_type: application/vnd.android.package-archive
          - target: ios
            os: macos-latest
            maven_profile: ios
            asset_suffix: ipa
            asset_type: application/octet-stream
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Apply Gluon License
        uses: gluonhq/gluon-build-license@v2
        with:
          gluon-license: ${{ secrets.GLUON_LICENSE }}
          dir: mobile

      - name: Build All Modules & Mobile Fat JAR
        run: mvn -B clean install -DskipTests

      - name: Build Native Mobile App
        working-directory: mobile
        run: mvn -B -P${{ matrix.maven_profile }} gluonfx:package -DskipTests

      - name: Find Mobile Artifact Path
        id: find_artifact
        run: |
          artifact_path=$(find mobile/target -type f -name "*.${{ matrix.asset_suffix }}" | head -n 1)
          if [ -z "$artifact_path" ]; then
            echo "ERROR: No mobile artifact found"
            exit 1
          fi
          echo "artifact_path=$artifact_path" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Upload Mobile Artifact to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_artifact.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
