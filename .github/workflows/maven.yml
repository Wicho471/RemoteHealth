name: Build & Release RemoteHealth

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Crear el Release en GitHub (se ejecuta primero)
  # ──────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: RemoteHealth ${{ github.ref_name }}
          body: Release generated automatically for ${{ github.ref_name }}
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────────────────
  # JOB 2: Compilar JAR para Desktop (Windows, macOS, Linux)
  # ──────────────────────────────────────────────────────────
  build-desktop:
    needs: create-release
    name: Build Desktop JAR on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            asset_name_suffix: windows.jar
          - os: ubuntu-latest
            asset_name_suffix: linux.jar
          - os: macos-latest
            asset_name_suffix: macos.jar
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get version from tag
        id: get_version
        run: echo "APP_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build Desktop Fat JAR with Maven
        # CORRECCIÓN: Se ejecuta 'install' en todo el proyecto para resolver dependencias,
        # y LUEGO se llama explícitamente a 'assembly:single' en el módulo 'desktop'.
        run: mvn -B install -DskipTests && mvn -B -pl desktop assembly:single

      - name: List files in target directory (for debugging)
        if: always()
        run: ls -R desktop/target

      - name: Upload Desktop JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: desktop/target/desktop-${{ env.APP_VERSION }}-jar-with-dependencies.jar
          asset_name: remotehealth-desktop-${{ github.ref_name }}-${{ matrix.asset_name_suffix }}
          asset_content_type: application/java-archive

  # ──────────────────────────────────────────────────────────
  # JOB 3: Compilar apps para Móviles (Android e iOS) usando una Matriz
  # ──────────────────────────────────────────────────────────
  build-mobile:
    needs: create-release
    name: Build Mobile App for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            maven_profile: android
            artifact_name: remotehealth-mobile-${{ github.ref_name }}.apk
            artifact_type: application/vnd.android.package-archive
            find_command: "find mobile/target/gluonfx -name '*.apk' | head -n 1"
          - target: ios
            os: macos-latest
            maven_profile: ios
            artifact_name: remotehealth-mobile-${{ github.ref_name }}.ipa
            artifact_type: application/octet-stream
            find_command: "find mobile/target/gluonfx -name '*.ipa' | head -n 1"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Apply Gluon License
        uses: gluonhq/gluon-build-license@v2
        with:
          gluon-license: ${{ secrets.GLUON_LICENSE }}
          # CORRECCIÓN: El parámetro correcto es 'dir', no 'project-path'.
          dir: mobile

      - name: Build Native Mobile App with Maven
        # Se ejecuta 'install' para resolver dependencias y luego 'gluonfx:package'
        run: mvn -B -P${{ matrix.maven_profile }} install gluonfx:package -pl mobile -am -DskipTests

      - name: Find Mobile Artifact Path
        id: find_artifact
        run: |
          artifact_path=$(${{ matrix.find_command }})
          echo "artifact_path=$artifact_path" >> $GITHUB_OUTPUT
      
      - name: Upload Mobile Artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_path }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: ${{ matrix.artifact_type }}